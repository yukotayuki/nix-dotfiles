onboarding = false
[keys]
# tmux 側の prefix (unbind C-b; set -g prefix C-g) に合わせる
prefix = "ctrl+g"
# tmux の `bind '|' split-window -h`（左右分割）に合わせる
# split_horizontal はデフォルトで tmux の `bind '-' split-window -v` と同じ prefix+minus なので上書き不要
split_vertical = "prefix+|"
# tmux のデフォルト detach キー (prefix+d) に合わせる
detach = "prefix+d"

[ui]
# tmux 側の `set -g mouse on` に合わせる
mouse_capture = true
agent_panel_sort = "spaces"
