# prefix
unbind C-b
set -g prefix C-g

# terminal
# screen-256color はイタリックや取り消し線に対応しないため、tmux 自身の terminfo を使う。
# true color は外側の Ghostty の terminfo が Tc を持つので、terminal-overrides で足さなくてよい。
set -g default-terminal "tmux-256color"

# general
set -g escape-time 0
set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

# vi mode
set -g mode-keys vi

# clipboard
# pbcopy は macOS にしか無いため、端末の OSC 52 でクリップボードへ送る。Linux でも SSH の先でも同じ設定で動く。
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# pane navigation (vim-like)
bind h select-pane -L
bind C-h select-pane -L
bind j select-pane -D
bind C-j select-pane -D
bind k select-pane -U
bind C-k select-pane -U
bind l select-pane -R
bind C-l select-pane -R

bind -n S-Left select-pane -L
bind -n S-Down select-pane -D
bind -n S-Up select-pane -U
bind -n S-Right select-pane -R

# splits
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# resize
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5

# synchronize panes
bind b set-window-option synchronize-panes on
bind B set-window-option synchronize-panes off

# status bar
# window-status-format / status-right は nord テーマに任せ、位置だけ上書きする（nord のデフォルトは bottom）。
set -g status on
set -g status-position top

# /bin/zsh は NixOS には無く、Ubuntu では home-manager の zsh ではないため、ログインシェル（$SHELL）を使う。
# default-command を指定して、ペインごとにログインシェルとして起動し直さないようにする。
set -g default-command "${SHELL}"
