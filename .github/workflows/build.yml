name: Build

on:
  # flake-update.yml が更新 PR のブランチを指定して起動する（手動実行も可）
  # schedule を使わない理由:
  #   時刻ずらしでは flake-update との実行順が保証されず、
  #   main の更新前の flake.lock をビルドしてしまうため
  # workflow_run を使わない理由:
  #   起動元（main）の ref で実行されるため、PR ブランチをビルドできない
  workflow_dispatch:

jobs:
  build:
    name: 全設定のフルビルド
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Nix をインストール
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Nix キャッシュを有効化
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: canele をビルド
        run: nix build .#homeConfigurations.canele.activationPackage --no-link

      - name: mochi をビルド
        # macOS 固有のパッケージは Linux でビルドできないため --dry-run で依存グラフの検証のみ行う
        run: nix build .#homeConfigurations.mochi.activationPackage --no-link --dry-run
