name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Nix フォーマットチェック (nixfmt-rfc-style)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Nix をインストール
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Nix キャッシュを有効化
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: フォーマットチェック
        run: nix fmt . && git diff --exit-code

  lint:
    name: Nix lint (deadnix + statix)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Nix をインストール
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Nix キャッシュを有効化
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: deadnix（未使用コード検出）
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail .

      - name: statix（アンチパターン検出）
        # hosts/uiro は NixOS 慣用の boot.loader.* スタイルが
        # W20（repeated keys）の誤検知を引き起こすため除外する。
        run: nix run --inputs-from . nixpkgs#statix -- check . -i "hosts/uiro"

  eval:
    name: 全設定の評価検証
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Nix をインストール
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Nix キャッシュを有効化
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: kinako を評価
        # nix-darwin は macOS でしかビルドできないため eval のみ実施。
        run: nix eval .#darwinConfigurations.kinako.system.drvPath

      - name: mochi を評価
        run: nix eval .#homeConfigurations.mochi.activationPackage.drvPath

      - name: canele を評価
        run: nix eval .#homeConfigurations.canele.activationPackage.drvPath
